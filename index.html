<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="移動ド">
<meta name="mobile-web-app-capable" content="yes">
<title>移動ド音程チェッカー</title>
<style>
  :root{
    --bg:#0f1115; --panel:#181c24; --panel2:#1f2531;
    --fg:#e8edf6; --dim:#8b96a8; --line:#2b3342;
    --ok:#37d67a; --warn:#f5c451; --bad:#ff6b6b; --accent:#6aa8ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
  body{min-height:100dvh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:560px;margin:0 auto;padding:10px 14px 28px}

  header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}
  h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.02em;color:var(--dim)}
  .keybadge{font-size:13px;color:var(--accent);background:#16243a;border:1px solid #24405f;
    padding:4px 10px;border-radius:999px;white-space:nowrap}
  .iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--fg);
    border-radius:10px;padding:7px 11px;font-size:14px;cursor:pointer}
  .iconbtn:active{background:var(--panel2)}

  /* ---- main display ---- */
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:14px 14px 10px;text-align:center;position:relative;overflow:hidden}
  .solfa{font-size:clamp(64px,22vw,120px);line-height:1.05;font-weight:700;
    letter-spacing:.02em;min-height:1.1em;transition:color .12s}
  .solfa.idle{color:#39414f}
  .solfa sup{font-size:.42em;vertical-align:super;margin-left:.02em}
  .sub{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;
    font-size:13px;color:var(--dim);margin-top:2px;min-height:18px}
  .sub b{color:var(--fg);font-weight:600}
  .degree{font-size:15px;color:var(--accent);min-height:20px;margin-top:4px}

  /* ---- cents meter ---- */
  .meter{margin:14px 0 4px;position:relative;height:56px}
  .track{position:absolute;left:0;right:0;top:18px;height:20px;border-radius:10px;
    background:linear-gradient(90deg,#2a1c1c 0%,#2a2a1c 22%,#16281d 44%,#16281d 56%,#2a2a1c 78%,#2a1c1c 100%);
    border:1px solid var(--line);overflow:hidden}
  .zone{position:absolute;top:18px;height:20px;left:calc(50% - 5%);width:10%;
    background:rgba(55,214,122,.14);border-left:1px solid rgba(55,214,122,.35);
    border-right:1px solid rgba(55,214,122,.35)}
  .center{position:absolute;top:12px;bottom:12px;left:50%;width:2px;background:#5b6577;transform:translateX(-1px)}
  .needle{position:absolute;top:8px;height:40px;width:4px;border-radius:3px;left:50%;
    background:var(--ok);transform:translateX(-2px);transition:left .07s linear,background .12s;
    box-shadow:0 0 12px rgba(255,255,255,.15)}
  .ticks{position:absolute;left:0;right:0;top:42px;display:flex;justify-content:space-between;
    font-size:10px;color:#5f6a7d}
  .verdict{font-size:17px;font-weight:600;min-height:24px;margin-top:2px}
  .cents{font-size:12px;color:var(--dim);min-height:16px}

  /* ---- scale strip ---- */
  .strip{display:flex;gap:5px;margin-top:14px;overflow-x:auto;padding-bottom:2px;
    scrollbar-width:none}
  .strip::-webkit-scrollbar{display:none}
  .deg{flex:1 0 auto;min-width:44px;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:7px 4px;text-align:center}
  .deg .n{font-size:17px;font-weight:600}
  .deg .d{font-size:10px;color:var(--dim);margin-top:1px}
  .deg.on{background:#1d3a5c;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .deg.on .d{color:#a9c9f5}

  /* ---- controls ---- */
  .row{display:flex;gap:10px;margin-top:14px}
  .btn{flex:1;padding:14px;border-radius:14px;border:none;font-size:16px;font-weight:600;
    background:var(--accent);color:#06121f;cursor:pointer}
  .btn.stop{background:#3a4354;color:var(--fg)}
  .btn:disabled{opacity:.5}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:12px 14px;margin-top:14px}
  .panel h2{font-size:12px;color:var(--dim);margin:0 0 10px;font-weight:600;letter-spacing:.08em}
  .field{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0}
  .field label{font-size:14px;color:var(--fg)}
  .field .hint{font-size:11px;color:var(--dim);display:block;margin-top:2px}
  select,input[type=number]{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:9px;padding:8px 10px;font-size:15px;min-width:110px}
  input[type=range]{width:130px;accent-color:var(--accent)}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{background:none;border:none;color:var(--dim);padding:8px 11px;font-size:13px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#06121f;font-weight:600}
  .sw{position:relative;width:48px;height:28px;background:var(--panel2);border:1px solid var(--line);
    border-radius:999px;cursor:pointer;flex:0 0 auto}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
    background:#6b7688;transition:.15s}
  .sw.on{background:#1d3a5c;border-color:var(--accent)}
  .sw.on::after{left:23px;background:var(--accent)}
  .note{font-size:11px;color:var(--dim);line-height:1.6;margin-top:10px}
  .err{background:#3a1d1d;border:1px solid #6b2b2b;color:#ffc9c9;border-radius:12px;
    padding:10px 12px;font-size:13px;margin-top:12px;line-height:1.6;display:none}
  .hidden{display:none !important}
  .lvl{position:relative;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:10px}
  .lvl i{display:block;height:100%;width:0;background:var(--accent);transition:width .06s}
  .lvl b{position:absolute;top:0;bottom:0;width:2px;background:var(--warn);left:0}
  .lvlrow{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--dim);
    margin-top:4px;min-height:15px}
  .lvlrow #micHint{color:var(--warn);text-align:right}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>移動ド音程チェッカー <span style="color:#5b6577">v2</span></h1>
    <div class="keybadge" id="keyBadge">Key: C major</div>
    <button class="iconbtn" id="btnSettings">設定</button>
  </header>

  <div class="stage">
    <div class="solfa idle" id="solfa">—</div>
    <div class="degree" id="degree"></div>
    <div class="sub" id="sub"></div>

    <div class="meter">
      <div class="track"></div>
      <div class="zone"></div>
      <div class="center"></div>
      <div class="needle" id="needle"></div>
      <div class="ticks"><span>♭ -50</span><span>-25</span><span>0</span><span>+25</span><span>+50 ♯</span></div>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="cents" id="centsTxt"></div>
    <div class="lvl"><i id="lvl"></i><b id="lvlGate"></b></div>
    <div class="lvlrow">
      <span id="lvlTxt">入力 —</span>
      <span id="micHint"></span>
    </div>
  </div>

  <div class="strip" id="strip"></div>

  <div class="row">
    <button class="btn" id="btnMic">マイク開始</button>
  </div>

  <div class="err" id="err"></div>

  <div class="panel hidden" id="settings">
    <h2>キー設定</h2>
    <div class="field">
      <label>主音（キー）</label>
      <select id="selRoot"></select>
    </div>
    <div class="field">
      <label>種類</label>
      <div class="seg" id="segMode">
        <button data-v="major" class="on">メジャー</button>
        <button data-v="minor">マイナー</button>
      </div>
    </div>

    <div id="minorOpts">
      <div class="field">
        <label>マイナーの階名体系
          <span class="hint" id="hintSystem"></span>
        </label>
        <div class="seg" id="segSystem">
          <button data-v="la" class="on">ラ基準</button>
          <button data-v="do">ド基準</button>
        </div>
      </div>
      <div class="field">
        <label>スケール
          <span class="hint">ハーモニック＝Ⅴ7（導音）対応</span>
        </label>
        <div class="seg" id="segMinor">
          <button data-v="natural" class="on">ナチュラル</button>
          <button data-v="harmonic">ハーモニック</button>
          <button data-v="both">両方</button>
        </div>
      </div>
    </div>

    <h2 style="margin-top:16px">マイク</h2>
    <div class="field">
      <label>入力デバイス</label>
      <select id="selDevice"><option value="">自動（既定のマイク）</option></select>
    </div>
    <div class="field">
      <label>自動ゲイン調整（AGC）
        <span class="hint">入力が小さいときはONのままに</span>
      </label>
      <div class="sw on" id="swAgc"></div>
    </div>
    <div class="field">
      <label>無音しきい値
        <span class="hint" id="gateHint"></span>
      </label>
      <input type="range" id="inGate" min="1" max="60" step="1" value="10">
    </div>

    <h2 style="margin-top:16px">表示</h2>
    <div class="field">
      <label>階名の表記</label>
      <div class="seg" id="segLang">
        <button data-v="ja" class="on">ドレミ</button>
        <button data-v="en">do re mi</button>
      </div>
    </div>
    <div class="field">
      <label>基準ピッチ A4</label>
      <span><input type="number" id="inA4" min="392" max="470" step="0.5" value="440" style="min-width:88px"> Hz</span>
    </div>
    <div class="field">
      <label>表示の安定化<span class="hint">音が途切れても少し保持</span></label>
      <div class="sw on" id="swHold"></div>
    </div>
    <div class="note">
      ・ラ基準＝日本の移動ド標準（Am なら A＝ラ、C＝ド）。ド基準＝短調の主音を「ド」と読む流儀。<br>
      ・ハーモニック選択時、Am の G♯（Ⅴ7＝E7 の第3音）がスケール内として扱われます。
    </div>
  </div>

  <div class="note" style="text-align:center">
    マイクは <b>localhost</b> または <b>https</b> でのみ使用できます。
  </div>
</div>

<script>
"use strict";
/* ============================================================
   音楽理論部 —— 移動ド（可動ド）マッピング
   ============================================================ */
const PC_SHARP = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
const PC_FLAT  = ["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];

// 全音階の階名（度数インデックス 0..6）
const SYL_JA = ["ド","レ","ミ","ファ","ソ","ラ","シ"];
const SYL_EN = ["do","re","mi","fa","sol","la","ti"];
const DIA_OFF = [0,2,4,5,7,9,11];           // 各階名の（参照主音からの）半音距離

// 非スケール音の既定の綴り（参照主音からの半音距離 → [階名index, 変化記号]）
const CHROM_DEFAULT = {
  1:[0,+1],   // ド♯
  3:[2,-1],   // ミ♭
  6:[3,+1],   // ファ♯
  8:[5,-1],   // ラ♭
 10:[6,-1],   // シ♭
};
const CHROM_EN = { "0+1":"di","2-1":"me","3+1":"fi","5-1":"le","6-1":"te",
                   "1+1":"ri","4+1":"si","1-1":"ra","4-1":"se","6+1":"ti♯","0-1":"do♭" };

// 主音からの半音距離 → 度数表記
const DEG_LABEL = ["1","♭2","2","♭3","3","4","♯4","5","♭6","6","♭7","7"];

const SCALES = {
  major:    [0,2,4,5,7,9,11],
  natural:  [0,2,3,5,7,8,10],
  harmonic: [0,2,3,5,7,8,11],
  both:     [0,2,3,5,7,8,10,11],   // 第7音は♭7と♮7の両方
};

function accStr(a){ return a>0 ? "♯".repeat(a) : a<0 ? "♭".repeat(-a) : ""; }

/**
 * キー設定から 12 音すべての「階名 / 度数 / スケール内か」の表を作る。
 * @returns {{table:Array, scale:Array, refPc:number}}
 */
function buildKey(rootPc, mode, minorSystem, minorScale, lang){
  const SYL = lang === "en" ? SYL_EN : SYL_JA;
  const isMinor = mode === "minor";
  const scaleName = isMinor ? minorScale : "major";
  const intervals = SCALES[scaleName];

  // 階名の参照主音（この音が「ド」になる）
  const refPc = (isMinor && minorSystem === "la") ? (rootPc + 3) % 12 : rootPc;

  // 度数 → 階名インデックスの起点
  //  メジャー: 1度=ド / ラ基準マイナー: 1度=ラ / ド基準マイナー: 1度=ド
  const startSyl = (isMinor && minorSystem === "la") ? 5 : 0;

  const table = new Array(12).fill(null);
  const scale = [];

  intervals.forEach((iv, idx) => {
    const pc = (rootPc + iv) % 12;
    // 度数番号（both のとき最後の2つはどちらも7度）
    let degNum;
    if (scaleName === "both") degNum = idx >= 6 ? 7 : idx + 1;
    else degNum = idx + 1;

    const sylIdx = (startSyl + degNum - 1) % 7;
    const off = (pc - refPc + 12) % 12;
    // 変化記号 = 実際の距離 − 素の階名の距離（±1 に収める）
    let acc = off - DIA_OFF[sylIdx];
    if (acc > 6) acc -= 12; else if (acc < -6) acc += 12;

    const name = SYL[sylIdx] + accStr(acc);
    const enChrom = CHROM_EN[sylIdx + (acc>0?"+1":acc<0?"-1":"")];
    const entry = {
      pc, inScale:true, degNum,
      name: (lang==="en" && acc!==0 && enChrom) ? enChrom : name,
      deg: DEG_LABEL[(pc - rootPc + 12) % 12],
    };
    if (!table[pc]) table[pc] = entry;
    scale.push(entry);
  });

  // スケール外の音を既定の綴りで埋める
  // ラ基準マイナーでは、参照主音から 8 半音＝短調の導音なので ラ♭ ではなく ソ♯ と綴る
  const chrom = Object.assign({}, CHROM_DEFAULT);
  if (isMinor && minorSystem === "la") chrom[8] = [4, +1];
  for (let pc = 0; pc < 12; pc++){
    if (table[pc]) continue;
    const off = (pc - refPc + 12) % 12;
    const di = DIA_OFF.indexOf(off);
    let sylIdx, acc;
    if (di >= 0){ sylIdx = di; acc = 0; }
    else { const c = chrom[off]; sylIdx = c[0]; acc = c[1]; }
    const enChrom = CHROM_EN[sylIdx + (acc>0?"+1":acc<0?"-1":"")];
    table[pc] = {
      pc, inScale:false, degNum:null,
      name: (lang==="en" && acc!==0 && enChrom) ? enChrom : SYL[sylIdx] + accStr(acc),
      deg: DEG_LABEL[(pc - rootPc + 12) % 12],
    };
  }
  return { table, scale, refPc };
}

// キーに応じて実音名（固定ド／英語音名）に♯♭どちらを使うか
const FLAT_MAJOR = [5,10,3,8,1,6];   // F,B♭,E♭,A♭,D♭,G♭
const FLAT_MINOR = [2,7,0,5,10,3];   // Dm,Gm,Cm,Fm,B♭m,E♭m
function pcName(pc, rootPc, mode){
  const flat = (mode==="major" ? FLAT_MAJOR : FLAT_MINOR).includes(rootPc);
  return (flat ? PC_FLAT : PC_SHARP)[pc];
}

/* ============================================================
   ピッチ検出 —— NSDF（McLeod Pitch Method）
   ============================================================ */
function detectPitch(buf, sr, gate, minF, maxF){
  const n = buf.length;
  // DC 除去 + RMS
  let mean = 0;
  for (let i=0;i<n;i++) mean += buf[i];
  mean /= n;
  let rms = 0;
  for (let i=0;i<n;i++){ buf[i] -= mean; rms += buf[i]*buf[i]; }
  rms = Math.sqrt(rms/n);
  if (rms < gate) return { freq:-1, rms, clarity:0 };

  const maxLag = Math.min(n-2, Math.floor(sr/minF));
  const minLag = Math.max(2, Math.floor(sr/maxF));
  const nsdf = new Float32Array(maxLag+1);
  for (let tau=0; tau<=maxLag; tau++){
    let acf=0, div=0;
    const lim = n - tau;
    for (let i=0;i<lim;i++){
      const a = buf[i], b = buf[i+tau];
      acf += a*b; div += a*a + b*b;
    }
    nsdf[tau] = div > 0 ? (2*acf)/div : 0;
  }

  // 最初の正のローブを飛ばし、以降の各正区間の極大を集める
  let t = 0;
  while (t <= maxLag && nsdf[t] > 0) t++;
  const peaks = [];
  while (t <= maxLag){
    if (nsdf[t] > 0){
      let lm = t;
      while (t <= maxLag && nsdf[t] > 0){ if (nsdf[t] > nsdf[lm]) lm = t; t++; }
      if (lm >= minLag && lm < maxLag) peaks.push(lm);
    } else t++;
  }
  if (!peaks.length) return { freq:-1, rms, clarity:0 };

  let best = peaks[0];
  for (const p of peaks) if (nsdf[p] > nsdf[best]) best = p;
  const K = 0.88, thr = nsdf[best] * K;
  let chosen = best;
  for (const p of peaks){ if (nsdf[p] >= thr){ chosen = p; break; } }
  const clarity = nsdf[chosen];
  if (clarity < 0.5) return { freq:-1, rms, clarity };

  // 放物線補間
  const x0 = nsdf[chosen-1], x1 = nsdf[chosen], x2 = nsdf[chosen+1];
  const den = 2*(2*x1 - x0 - x2);
  const d = den !== 0 ? (x2 - x0)/den : 0;
  const lag = chosen + Math.max(-1, Math.min(1, d));
  return { freq: sr/lag, rms, clarity };
}

/* ============================================================
   状態 / 設定
   ============================================================ */
const S = {
  root:0, mode:"major", minorSystem:"la", minorScale:"natural",
  lang:"ja", a4:440, gate:10, hold:true, agc:true, deviceId:"",
};
// しきい値は S.gate/5000（= gate 10 で RMS 0.002 ≒ -54dB）
const GATE_DIV = 5000;
const gateRms = () => S.gate / GATE_DIV;
const toDb = v => v > 1e-7 ? 20 * Math.log10(v) : -100;
// -80dB〜0dB を 0〜100% に写す（メーター表示用）
const dbToPct = db => Math.max(0, Math.min(100, (db + 80) / 80 * 100));
const LS = "movabledo.settings.v2";
function loadSettings(){
  try{ Object.assign(S, JSON.parse(localStorage.getItem(LS) || "{}")); }catch(e){}
}
function saveSettings(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }

let KEY = null;
function rebuildKey(){
  KEY = buildKey(S.root, S.mode, S.minorSystem, S.minorScale, S.lang);
  const rootName = pcName(S.root, S.root, S.mode);
  $("keyBadge").textContent = "Key: " + rootName + (S.mode==="major" ? " major" : " minor");
  $("hintSystem").textContent = S.mode==="minor"
    ? (S.minorSystem==="la"
        ? rootName + " ＝ ラ、" + pcName((S.root+3)%12, S.root, S.mode) + " ＝ ド"
        : rootName + " ＝ ド（短調主音をドと読む）")
    : "";
  renderStrip();
  render();
}

/* ============================================================
   UI
   ============================================================ */
const $ = id => document.getElementById(id);

function renderStrip(){
  const strip = $("strip");
  strip.innerHTML = "";
  KEY.scale.forEach(e => {
    const d = document.createElement("div");
    d.className = "deg";
    d.dataset.pc = e.pc;
    d.innerHTML = '<div class="n">' + e.name + '</div><div class="d">' +
                  e.deg + " / " + pcName(e.pc, S.root, S.mode) + "</div>";
    strip.appendChild(d);
  });
}

let cur = { pc:null, cents:0, freq:0, midi:0, active:false };

function render(){
  const solfa = $("solfa"), needle = $("needle");
  if (cur.pc === null){
    solfa.textContent = "—";
    solfa.classList.add("idle");
    $("degree").textContent = "";
    $("sub").innerHTML = "";
    $("verdict").textContent = "";
    $("centsTxt").textContent = "";
    needle.style.left = "50%";
    needle.style.background = "#3a4354";
    [...document.querySelectorAll(".deg")].forEach(d => d.classList.remove("on"));
    return;
  }
  const e = KEY.table[cur.pc];
  const c = cur.cents;
  const absC = Math.abs(c);
  const color = absC <= 5 ? "var(--ok)" : absC <= 15 ? "var(--warn)" : "var(--bad)";

  solfa.classList.toggle("idle", !cur.active);
  solfa.style.color = cur.active ? color : "";
  solfa.textContent = e.name;

  $("degree").textContent = e.inScale
      ? (e.deg + "度" + (S.mode==="minor" && e.degNum===7 && (cur.pc - S.root + 12)%12 === 11 ? "（導音・Ⅴ7）" : ""))
      : e.deg + "度（スケール外）";

  const oct = Math.floor(cur.midi/12) - 1;
  $("sub").innerHTML =
    "<span>実音 <b>" + pcName(cur.pc, S.root, S.mode) + oct + "</b></span>" +
    "<span><b>" + cur.freq.toFixed(1) + "</b> Hz</span>";

  const pos = Math.max(-50, Math.min(50, c));
  needle.style.left = (50 + pos) + "%";
  needle.style.background = color;

  let v;
  if (absC <= 5) v = "ぴったり";
  else if (absC <= 15) v = c > 0 ? "ちょっと高い" : "ちょっと低い";
  else if (absC <= 35) v = c > 0 ? "高い" : "低い";
  else v = c > 0 ? "かなり高い" : "かなり低い";
  $("verdict").textContent = v;
  $("verdict").style.color = color;
  $("centsTxt").textContent = (c >= 0 ? "+" : "") + c.toFixed(0) + " cent";

  [...document.querySelectorAll(".deg")].forEach(d =>
    d.classList.toggle("on", Number(d.dataset.pc) === cur.pc));
}

/* ---- 設定 UI 結線 ---- */
function initUI(){
  const sel = $("selRoot");
  for (let pc = 0; pc < 12; pc++){
    const o = document.createElement("option");
    o.value = pc;
    o.textContent = PC_SHARP[pc] + (PC_SHARP[pc] !== PC_FLAT[pc] ? " / " + PC_FLAT[pc] : "");
    sel.appendChild(o);
  }
  sel.value = S.root;
  sel.onchange = () => { S.root = Number(sel.value); saveSettings(); rebuildKey(); };

  function seg(id, key, after){
    const el = $(id);
    [...el.children].forEach(b => {
      b.classList.toggle("on", b.dataset.v === S[key]);
      b.onclick = () => {
        S[key] = b.dataset.v;
        [...el.children].forEach(x => x.classList.toggle("on", x === b));
        saveSettings(); rebuildKey(); if (after) after();
      };
    });
  }
  seg("segMode","mode", syncMinorVisibility);
  seg("segSystem","minorSystem");
  seg("segMinor","minorScale");
  seg("segLang","lang");

  $("inA4").value = S.a4;
  $("inA4").onchange = () => { S.a4 = Number($("inA4").value) || 440; saveSettings(); };
  $("inGate").value = S.gate;
  const gateTxt = () => {
    $("gateHint").textContent = "これより小さい音は無視（" + toDb(gateRms()).toFixed(0) + " dB）";
    $("lvlGate").style.left = dbToPct(toDb(gateRms())) + "%";
  };
  $("inGate").oninput = () => { S.gate = Number($("inGate").value); gateTxt(); saveSettings(); };
  gateTxt();

  const swAgc = $("swAgc");
  swAgc.classList.toggle("on", S.agc);
  swAgc.onclick = () => {
    S.agc = !S.agc; swAgc.classList.toggle("on", S.agc); saveSettings();
    if (running) restartMic();
  };

  $("selDevice").onchange = () => {
    S.deviceId = $("selDevice").value; saveSettings();
    if (running) restartMic();
  };

  const sw = $("swHold");
  sw.classList.toggle("on", S.hold);
  sw.onclick = () => { S.hold = !S.hold; sw.classList.toggle("on", S.hold); saveSettings(); };

  $("btnSettings").onclick = () => $("settings").classList.toggle("hidden");
  $("btnMic").onclick = toggleMic;
  syncMinorVisibility();
}
function syncMinorVisibility(){
  $("minorOpts").classList.toggle("hidden", S.mode !== "minor");
}

/* ============================================================
   マイク処理
   ============================================================ */
let audioCtx = null, stream = null, analyser = null, running = false, rafId = 0;
let buf = null, lastDetect = 0, lastHit = 0;
const histF = [];

function showErr(msg){ const e = $("err"); e.style.display = "block"; e.innerHTML = msg; }
function clearErr(){ $("err").style.display = "none"; }

async function toggleMic(){
  if (running){ stopMic(); return; }
  clearErr();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showErr("このブラウザ／URLではマイクを使えません。<b>http://localhost</b> か <b>https://</b> で開いてください。");
    return;
  }
  const audioConstraints = {
    echoCancellation:false, noiseSuppression:false, autoGainControl:S.agc,
  };
  if (S.deviceId) audioConstraints.deviceId = { exact: S.deviceId };
  try{
    stream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
  }catch(err){
    showErr("マイクを開始できませんでした：" + err.name +
      "<br>ブラウザのアドレスバーからマイクを「許可」にしてください。");
    return;
  }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();
  const src = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;   // ≒43ms 窓（55Hz まで検出可・低遅延）
  analyser.smoothingTimeConstant = 0;
  src.connect(analyser);
  buf = new Float32Array(analyser.fftSize);
  running = true;
  $("btnMic").textContent = "マイク停止";
  $("btnMic").classList.add("stop");
  histF.length = 0;
  populateDevices();
  loop();
}

// 権限が下りた後でないとデバイス名が取れないため、開始後に一覧を作る
async function populateDevices(){
  try{
    const list = await navigator.mediaDevices.enumerateDevices();
    const sel = $("selDevice");
    const ins = list.filter(d => d.kind === "audioinput");
    sel.innerHTML = '<option value="">自動（既定のマイク）</option>';
    ins.forEach((d, i) => {
      const o = document.createElement("option");
      o.value = d.deviceId;
      o.textContent = d.label || ("マイク " + (i+1));
      sel.appendChild(o);
    });
    sel.value = S.deviceId || "";
  }catch(e){}
}

async function restartMic(){ stopMic(); await toggleMic(); }

function stopMic(){
  running = false;
  cancelAnimationFrame(rafId);
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  stream = audioCtx = analyser = null;
  $("btnMic").textContent = "マイク開始";
  $("btnMic").classList.remove("stop");
  cur = { pc:null, cents:0, freq:0, midi:0, active:false };
  $("lvl").style.width = "0%";
  $("lvlTxt").textContent = "入力 —";
  $("micHint").textContent = "";
  render();
}

function median(a){ const b = [...a].sort((x,y)=>x-y); return b[(b.length-1)>>1]; }

function loop(){
  if (!running) return;
  rafId = requestAnimationFrame(loop);
  const now = performance.now();
  if (now - lastDetect < 25) return;
  lastDetect = now;

  analyser.getFloatTimeDomainData(buf);
  const r = detectPitch(buf, audioCtx.sampleRate, gateRms(), 55, 1600);

  const db = toDb(r.rms);
  $("lvl").style.width = dbToPct(db) + "%";
  $("lvlTxt").textContent = "入力 " + (db <= -99 ? "—" : db.toFixed(0) + " dB");
  if (r.rms >= gateRms()) {
    $("micHint").textContent = r.freq > 0 ? "" : "音程を判定できません（単音で伸ばして）";
  } else if (db > -99) {
    $("micHint").textContent = "音が小さい（しきい値 " + toDb(gateRms()).toFixed(0) + " dB 未満）";
  } else {
    $("micHint").textContent = "";
  }

  if (r.freq > 0){
    histF.push(r.freq);
    if (histF.length > 3) histF.shift();
    const f = median(histF);
    const midiF = 69 + 12 * Math.log2(f / S.a4);
    const midi = Math.round(midiF);
    const cents = (midiF - midi) * 100;
    cur = { pc: ((midi % 12) + 12) % 12, cents, freq: f, midi, active: true };
    lastHit = now;
    render();
  } else {
    histF.length = 0;
    const holdMs = S.hold ? 1200 : 250;
    if (cur.pc !== null && now - lastHit > holdMs){
      cur = { pc:null, cents:0, freq:0, midi:0, active:false };
      render();
    } else if (cur.active && now - lastHit > 200){
      cur.active = false; render();
    }
  }
}

/* ---- 起動 ---- */
loadSettings();
initUI();
rebuildKey();
render();
if (!window.isSecureContext){
  showErr("安全でない接続（file:// など）で開かれています。マイクは使えません。<br>" +
          "同梱の <b>起動.command</b> をダブルクリックして <b>http://localhost:8765</b> で開いてください。");
}

// 自己テスト用フック
window.__mdc = { buildKey, detectPitch, pcName, get S(){ return S; }, get KEY(){ return KEY; } };
</script>
